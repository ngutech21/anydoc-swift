accepted = [
  "MIT",
  "Apache-2.0",
  "BSD-3-Clause",
  "Unicode-3.0",
  "Zlib",
]

targets = [
  "aarch64-apple-darwin",
  "aarch64-apple-ios",
  "aarch64-apple-ios-sim",
]
ignore-build-dependencies = false
ignore-dev-dependencies = true
ignore-transitive-dependencies = false
workarounds = ["chrono", "cocoa"]
private = { ignore = true }

# This crate omits the repository-root license from its published archive.
# cargo-about takes the revision from the locked crate's .cargo_vcs_info.json:
# https://github.com/dropbox/rust-alloc-no-stdlib/blob/ae42d22078b98549e987d2f03d12df7b984fde47/LICENSE
[alloc-stdlib.clarify]
license = "BSD-3-Clause"

[[alloc-stdlib.clarify.git]]
path = "LICENSE"
checksum = "c0c56f26d9c051cac4d200c34c84e7ae9aaa853e01a982a1df08b09931e518ae"

# Select the shipped BSD-3-Clause option of BSD-3-Clause OR MIT. The archive
# contains no MIT text, so choosing MIT would produce a placeholder notice.
# https://github.com/dropbox/rust-brotli-decompressor/blob/b56177b8eb3d2440536281397e5ffe06eedf1a5c/LICENSE
[brotli-decompressor.clarify]
license = "BSD-3-Clause"

[[brotli-decompressor.clarify.files]]
path = "LICENSE"
checksum = "c0c56f26d9c051cac4d200c34c84e7ae9aaa853e01a982a1df08b09931e518ae"

# Both crates omit their shared repository-root license. Resolve it at the
# revision in each locked crate's .cargo_vcs_info.json:
