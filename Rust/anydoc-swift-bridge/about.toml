accepted = [
  "MIT",
  "Apache-2.0",
  "BSD-3-Clause",
  "Unicode-3.0",
  "Zlib",
]

targets = [
  "aarch64-apple-darwin",
  "aarch64-apple-ios",
  "aarch64-apple-ios-sim",
]
ignore-build-dependencies = false
ignore-dev-dependencies = true
ignore-transitive-dependencies = false
workarounds = ["chrono", "cocoa"]
private = { ignore = true }

# The embedded Adobe CMaps carry their own BSD license in addition to the
# crate's MIT license. Both files are included in every framework's notices.
[pdf-inspector.clarify]
license = "MIT AND BSD-3-Clause"

[[pdf-inspector.clarify.files]]
path = "LICENSE"
license = "MIT"
checksum = "c0689c6b1f93155007b113acbb55a3a9b8bf1c7bdae4b14aa4175b04b37207de"

[[pdf-inspector.clarify.files]]
path = "external/bcmaps/LICENSE"
license = "BSD-3-Clause"
checksum = "aa92ab5a472974865a96fd4a4e9c13bb41bf6fe1b309cb6b8da48bc9e19839a2"

# The crate ships two whitespace-different copies of the MIT license.
[miniz_oxide.clarify]
license = "MIT OR Zlib OR Apache-2.0"

[[miniz_oxide.clarify.files]]
path = "LICENSE-MIT.md"
license = "MIT"
checksum = "799e9ca9d179295ef372f25d3769cdda7d25bb2668add6a6a1e22d1e4c678b8d"
