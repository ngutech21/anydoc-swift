name: Release Binary

env:
  EMBEDDED_ANYDOC_VERSION: 0.2.4
  BRIDGE_ABI_VERSION: 3

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without a leading v (for example, 0.2.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-binary-${{ github.repository }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release request
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_TAG: binary-${{ inputs.version }}
    steps:
      - name: Validate version and branch
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "version must be MAJOR.MINOR.PATCH without a leading v" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" != "refs/heads/master" ]]; then
            echo "binary releases must run from master" >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Refuse an existing release or tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing_release_ids="$(
            gh api --paginate \
              "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq ".[] | select(.tag_name == \"$RELEASE_TAG\") | .id"
          )"
          if [[ -n "$existing_release_ids" ]]; then
            echo "release $RELEASE_TAG already exists" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "tag $RELEASE_TAG already exists" >&2
            exit 1
          else
            status=$?
            if [[ "$status" -ne 2 ]]; then
              exit "$status"
            fi
          fi

      - name: Verify embedded release metadata
        run: |
          grep -Fq "const ABI_VERSION: u32 = $BRIDGE_ABI_VERSION;" \
            Rust/anydoc-swift-bridge/src/lib.rs
          grep -Fq "b\"anydoc $EMBEDDED_ANYDOC_VERSION (" \
            Rust/anydoc-swift-bridge/src/lib.rs

  macos:
    name: Build macOS arm64 artifact
    needs: validate
    runs-on: macos-26
    timeout-minutes: 60
    env:
      ARCHIVE_PATH: .build/artifacts/AnyDocSwiftBridge.xcframework.zip
      ASSET_NAME: AnyDocSwiftBridge.xcframework.zip
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Report pinned toolchains
        run: |
          test "$(uname -m)" = "arm64"
          xcrun swift --version
          rustup show active-toolchain
          rustc --version
          cargo --version

      - name: Install build tools
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: just,cargo-about@0.9.1

      - name: Build and verify release artifact
        run: |
          just artifact-macos
          Scripts/memory-probe.sh
          test -f "$ARCHIVE_PATH"
          checksum="$(swift package compute-checksum "$ARCHIVE_PATH")"
          printf '%s  %s\n' "$checksum" "$ASSET_NAME" > "$ARCHIVE_PATH.sha256"

      - name: Preserve verified artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-macos-arm64
          path: |
            ${{ env.ARCHIVE_PATH }}
            ${{ env.ARCHIVE_PATH }}.sha256
          include-hidden-files: true
          if-no-files-found: error

  linux:
    name: Build ${{ matrix.target }} artifact
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            docker_arch: amd64
            runner_arch: X64
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            docker_arch: arm64
            runner_arch: ARM64
            target: aarch64-unknown-linux-gnu
    env:
      ANYDOC_SWIFT_ARTIFACT_VERSION: ${{ inputs.version }}
      ANYDOC_SWIFT_LINUX_TARGET: ${{ matrix.target }}
      ARCHIVE_PATH: .build/artifacts/AnyDocSwiftBridge-${{ matrix.target }}.artifactbundle.zip
      ASSET_NAME: AnyDocSwiftBridge-${{ matrix.target }}.artifactbundle.zip
      LINUX_BUILD_IMAGE: anydoc-swift-linux:${{ matrix.docker_arch }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify native runner architecture
        env:
          EXPECTED_RUNNER_ARCH: ${{ matrix.runner_arch }}
        run: test "$RUNNER_ARCH" = "$EXPECTED_RUNNER_ARCH"

      - name: Build pinned Swift and Rust environment
        run: |
          docker build \
            --platform "linux/${{ matrix.docker_arch }}" \
            --build-arg "TARGETARCH=${{ matrix.docker_arch }}" \
            --file Native/linux/Dockerfile \
            --tag "$LINUX_BUILD_IMAGE" \
            .

      - name: Build, audit, and test release artifact
        run: |
          docker run --rm \
            --platform "linux/${{ matrix.docker_arch }}" \
            --env ANYDOC_SWIFT_ARTIFACT_VERSION \
            --env ANYDOC_SWIFT_LINUX_TARGET \
            --env ARCHIVE_PATH \
            --env ASSET_NAME \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            "$LINUX_BUILD_IMAGE" \
            bash -euo pipefail -c '
              Scripts/linux-artifact.sh ci
              Scripts/linux-artifact.sh memory-probe
              test -f "$ARCHIVE_PATH"
              # The container owns the artifact directory, so write the checksum here.
              (
                cd "$(dirname "$ARCHIVE_PATH")"
                sha256sum "$ASSET_NAME" > "$ASSET_NAME.sha256"
              )
            '

      - name: Preserve verified artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-${{ matrix.target }}
          path: |
            ${{ env.ARCHIVE_PATH }}
            ${{ env.ARCHIVE_PATH }}.sha256
          include-hidden-files: true
          if-no-files-found: error

  draft:
    name: Create verified draft release
    needs:
      - macos
      - linux
    runs-on: ubuntu-24.04
    environment: binary-release
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    env:
      ASSET_DIRECTORY: .build/release-assets
      RELEASE_TAG: binary-${{ inputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download verified build outputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ env.ASSET_DIRECTORY }}
          merge-multiple: true

      - name: Verify checksums and expected assets
        run: |
          expected_assets=(
            AnyDocSwiftBridge.xcframework.zip
            AnyDocSwiftBridge-x86_64-unknown-linux-gnu.artifactbundle.zip
            AnyDocSwiftBridge-aarch64-unknown-linux-gnu.artifactbundle.zip
          )
          for asset in "${expected_assets[@]}"; do
            test -f "$ASSET_DIRECTORY/$asset"
            test -f "$ASSET_DIRECTORY/$asset.sha256"
            (cd "$ASSET_DIRECTORY" && sha256sum --check "$asset.sha256")
          done
          test "$(find "$ASSET_DIRECTORY" -maxdepth 1 -name '*.zip' | wc -l | tr -d ' ')" = "3"

      - name: Verify immutable releases are enabled
        env:
          GH_TOKEN: ${{ secrets.RELEASE_SETTINGS_TOKEN }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "RELEASE_SETTINGS_TOKEN must have Administration: read for this repository" >&2
            exit 1
          fi
          if ! immutable="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/$GITHUB_REPOSITORY/immutable-releases" \
              --jq '.enabled'
          )"; then
            echo "repository release immutability is not enabled or could not be verified" >&2
            exit 1
          fi
          test "$immutable" = "true"

      - name: Recheck release and tag availability
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -z "$(
            gh api --paginate \
              "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq ".[] | select(.tag_name == \"$RELEASE_TAG\") | .id"
          )"
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "tag $RELEASE_TAG was created while artifacts were building" >&2
            exit 1
          else
            status=$?
            test "$status" -eq 2
          fi

      - name: Create and verify release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$RELEASE_TAG" \
            -f sha="$GITHUB_SHA" \
            >/dev/null
          test "$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" \
              --jq '.object.type'
          )" = "commit"
          test "$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" \
              --jq '.object.sha'
          )" = "$GITHUB_SHA"

      - name: Create draft release
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes_file="$RUNNER_TEMP/release-notes.md"
          {
            echo "Embeds anydoc $EMBEDDED_ANYDOC_VERSION with bridge ABI v$BRIDGE_ABI_VERSION."
            echo
            echo 'SwiftPM checksums (SHA-256):'
            echo
            for checksum_file in "$ASSET_DIRECTORY"/*.zip.sha256; do
              read -r checksum asset_name < "$checksum_file"
              printf -- "- \`%s\`: \`%s\`\n" "$asset_name" "$checksum"
            done
          } > "$notes_file"
          # Use the creation response so draft discovery cannot race the release list.
          release_id="$(
            gh api --method POST \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$RELEASE_TAG" \
              -f target_commitish="$GITHUB_SHA" \
              -F draft=true \
              -f make_latest=false \
              -F body="@$notes_file" \
              -f name="$RELEASE_TAG (anydoc $EMBEDDED_ANYDOC_VERSION, ABI v$BRIDGE_ABI_VERSION)" \
              --jq '.id'
          )"
          if [[ ! "$release_id" =~ ^[1-9][0-9]*$ ]]; then
            echo "release creation returned an invalid ID: $release_id" >&2
            exit 1
          fi
          echo "Created draft release $release_id for $RELEASE_TAG"
          for archive in "$ASSET_DIRECTORY"/*.zip; do
            asset_name="${archive##*/}"
            gh api --method POST \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              -H "Content-Type: application/zip" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$release_id/assets?name=$asset_name" \
              --input "$archive" \
              >/dev/null
          done
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

  verify-macos:
    name: Verify downloaded macOS draft asset
    needs: draft
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      # GitHub requires push access to read unpublished draft release assets.
      contents: write
    env:
      ASSET_NAME: AnyDocSwiftBridge.xcframework.zip
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      RELEASE_ID: ${{ needs.draft.outputs.release_id }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download original build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-macos-arm64
          path: .build/original

      - name: Report pinned toolchains
        run: |
          test "$(uname -m)" = "arm64"
          xcrun swift --version
          rustup show active-toolchain
          rustc --version

      - name: Install verification tools
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: just

      - name: Download and verify draft asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset_ids="$(
            gh api --paginate \
              "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" \
              --jq ".[] | select(.name == \"$ASSET_NAME\") | .id"
          )"
          test "$(printf '%s\n' "$asset_ids" | sed '/^$/d' | wc -l | tr -d ' ')" = "1"
          downloaded="$RUNNER_TEMP/$ASSET_NAME"
          gh api \
            -H "Accept: application/octet-stream" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/releases/assets/$asset_ids" \
            > "$downloaded"
          cmp ".build/original/$ASSET_NAME" "$downloaded"
          expected_checksum="$(awk '{ print $1 }' ".build/original/$ASSET_NAME.sha256")"
          test "$(swift package compute-checksum "$downloaded")" = "$expected_checksum"
          just verify-artifact-macos "$downloaded"
          Scripts/memory-probe.sh

  verify-linux:
    name: Verify downloaded ${{ matrix.target }} draft asset
    needs: draft
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      # GitHub requires push access to read unpublished draft release assets.
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            docker_arch: amd64
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            docker_arch: arm64
            target: aarch64-unknown-linux-gnu
    env:
      ANYDOC_SWIFT_ARTIFACT_VERSION: ${{ inputs.version }}
      ANYDOC_SWIFT_LINUX_TARGET: ${{ matrix.target }}
      ASSET_NAME: AnyDocSwiftBridge-${{ matrix.target }}.artifactbundle.zip
      LINUX_BUILD_IMAGE: anydoc-swift-linux:${{ matrix.docker_arch }}
      RELEASE_ID: ${{ needs.draft.outputs.release_id }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download original build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-${{ matrix.target }}
          path: .build/original

      - name: Download draft asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset_ids="$(
            gh api --paginate \
              "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" \
              --jq ".[] | select(.name == \"$ASSET_NAME\") | .id"
          )"
          test "$(printf '%s\n' "$asset_ids" | sed '/^$/d' | wc -l | tr -d ' ')" = "1"
          mkdir -p .build/release-download
          gh api \
            -H "Accept: application/octet-stream" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/releases/assets/$asset_ids" \
            > ".build/release-download/$ASSET_NAME"
          cmp ".build/original/$ASSET_NAME" ".build/release-download/$ASSET_NAME"
          expected_checksum="$(awk '{ print $1 }' ".build/original/$ASSET_NAME.sha256")"
          test "$(sha256sum ".build/release-download/$ASSET_NAME" | awk '{ print $1 }')" = "$expected_checksum"

      - name: Build pinned verification environment
        run: |
          docker build \
            --platform "linux/${{ matrix.docker_arch }}" \
            --build-arg "TARGETARCH=${{ matrix.docker_arch }}" \
            --file Native/linux/Dockerfile \
            --tag "$LINUX_BUILD_IMAGE" \
            .

      - name: Reverify artifact and Cargo-free consumers
        run: |
          docker run --rm \
            --platform "linux/${{ matrix.docker_arch }}" \
            --env ANYDOC_SWIFT_ARTIFACT_VERSION \
            --env ANYDOC_SWIFT_LINUX_TARGET \
            --env ASSET_NAME \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            "$LINUX_BUILD_IMAGE" \
            bash -euo pipefail -c '
              Scripts/linux-artifact.sh verify ".build/release-download/$ASSET_NAME"
              Scripts/linux-artifact.sh build-swift
              Scripts/linux-artifact.sh test-swift
              Scripts/linux-artifact.sh composition
              Scripts/linux-artifact.sh memory-probe
            '

  publish:
    name: Publish immutable binary release
    needs:
      - draft
      - verify-macos
      - verify-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_ID: ${{ needs.draft.outputs.release_id }}
    steps:
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false \
            -f make_latest=false \
            >/dev/null

      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
              --jq '.draft == false and .immutable == true'
          )" = "true"
