name: CodeQL

on:
  pull_request:
  push:
    branches:
      - master
  schedule:
    - cron: '25 20 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: swift
            # Xcode 26.2 is required below and is not installed on xcode-27.
            runner: macos-26
            build-mode: manual
          - language: rust
            runner: ubuntu-24.04
            build-mode: none
          - language: c-cpp
            runner: ubuntu-24.04
            build-mode: none
          - language: python
            runner: ubuntu-24.04
            build-mode: none
          - language: actions
            runner: ubuntu-24.04
            build-mode: none
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode for Swift analysis
        if: matrix.language == 'swift'
        # Keep the supported Swift 6.2 compiler until CodeQL supports Swift 6.4.
        run: echo "DEVELOPER_DIR=/Applications/Xcode_26.2.app/Contents/Developer" >> "$GITHUB_ENV"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build Swift library
        if: matrix.language == 'swift'
        # Let CodeQL trace the compiler process; --arch selects the build target.
        run: |
          xcrun swift --version
          xcrun swift build \
            --arch arm64 \
            --scratch-path "$RUNNER_TEMP/codeql-swift"

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: /language:${{ matrix.language }}
