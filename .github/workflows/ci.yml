name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select pinned Rust toolchain
        run: |
          rustup show active-toolchain
          rustc --version
          cargo --version

      - name: Install just
        uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2.87.1
        with:
          tool: just,cargo-about@0.9.1

      
      - name: Cache Cargo dependencies and build output
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          workspaces: Rust/anydoc-swift-bridge -> target

      - name: Build and test Rust package
        run: just ci-rust

  swift:
    name: Swift
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Report pinned toolchains
        run: |
          xcrun swift --version
          rustup show active-toolchain
          rustc --version
          cargo --version

      - name: Install just
        uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2.87.1
        with:
          tool: just,cargo-about@0.9.1


      - name: Cache Cargo dependencies and artifact build output
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          workspaces: Rust/anydoc-swift-bridge -> ../../.build/artifact/cargo

      - name: Build and test Swift package
        run: just ci-swift
