name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select pinned Rust toolchain
        run: |
          rustup show active-toolchain
          rustc --version
          cargo --version

      - name: Install just
        uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2.87.13
        with:
          tool: just,cargo-about@0.9.1,shellcheck

      - name: Cache Cargo dependencies and build output
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          workspaces: Rust/anydoc-swift-bridge -> target

      - name: Build and test Rust package
        run: just ci-rust

  swift:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Swift / macOS arm64
            runner: xcode-27
            xcode: '27.0'
            swift: '6.4'
          - name: Swift 6.2 / macOS arm64
            runner: macos-26
            xcode: '26.2'
            swift: '6.2'
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
      EXPECTED_XCODE_VERSION: ${{ matrix.xcode }}
      EXPECTED_SWIFT_VERSION: ${{ matrix.swift }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Report pinned toolchains
        run: |
          test "$(uname -m)" = "arm64"
          xcodebuild -version | grep -Fx "Xcode $EXPECTED_XCODE_VERSION"
          xcrun swift --version
          test "$(xcrun swift --version | sed -n 's/.*Apple Swift version \([0-9]*\.[0-9]*\).*/\1/p')" = "$EXPECTED_SWIFT_VERSION"
          rustup show active-toolchain
          rustc --version
          cargo --version

      - name: Install just
        uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2.87.13
        with:
          tool: just,cargo-about@0.9.1

      - name: Cache Cargo dependencies and artifact build output
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          key: xcode-${{ matrix.xcode }}
          workspaces: Rust/anydoc-swift-bridge -> ../../.build/artifact/cargo

      - name: Build and test Swift package
        run: just ci-swift

  linux:
    name: Swift / ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            docker_arch: amd64
            runner_arch: X64
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            docker_arch: arm64
            runner_arch: ARM64
            target: aarch64-unknown-linux-gnu
    env:
      ANYDOC_SWIFT_ARTIFACT_VERSION: 0.2.0
      ANYDOC_SWIFT_LINUX_TARGET: ${{ matrix.target }}
      LINUX_BUILD_IMAGE: anydoc-swift-linux:${{ matrix.docker_arch }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify native runner architecture
        env:
          EXPECTED_RUNNER_ARCH: ${{ matrix.runner_arch }}
        run: test "$RUNNER_ARCH" = "$EXPECTED_RUNNER_ARCH"

      - name: Build pinned Swift and Rust environment
        run: |
          docker build \
            --platform "linux/${{ matrix.docker_arch }}" \
            --build-arg "TARGETARCH=${{ matrix.docker_arch }}" \
            --file Native/linux/Dockerfile \
            --tag "$LINUX_BUILD_IMAGE" \
            .

      - name: Build, audit, and test Linux package
        run: |
          docker run --rm \
            --platform "linux/${{ matrix.docker_arch }}" \
            --env ANYDOC_SWIFT_ARTIFACT_VERSION \
            --env ANYDOC_SWIFT_LINUX_TARGET \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            "$LINUX_BUILD_IMAGE" \
            Scripts/linux-artifact.sh ci
